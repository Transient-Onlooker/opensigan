[project]
name = "opensigan-workers-api"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pycomcigan==1.4.4",
    "pycryptodomex==3.24.2",
    "requests==2.34.2",
]

[tool.uv]
find-links = ["wheelhouse"]

[tool.uv.sources]
pycomcigan = { path = "wheelhouse/pycomcigan-1.4.4-py3-none-any.whl" }
pycryptodomex = { index = "pypi" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[dependency-groups]
dev = ["workers-py==1.17.9", "workers-runtime-sdk==1.9.6", "uv==0.13.4"]

[tool.pywrangler]
allow-build = false

[project]
name = "opensigan-workers-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pycomcigan==1.4.3",
    "pycryptodomex==3.24.2",
    "requests==2.34.2",
]

[tool.uv]
find-links = ["wheelhouse"]

[tool.uv.sources]
pycomcigan = { path = "wheelhouse/pycomcigan-1.4.3-py3-none-any.whl" }

[dependency-groups]
dev = ["workers-py==1.17.9", "workers-runtime-sdk==1.9.6", "uv==0.13.4"]

[tool.pywrangler]
allow-build = false
